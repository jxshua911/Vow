name: One-shot Lucide cleanup

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: one-shot-lucide-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor == 'jxshua911'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capacitor-mobile
          fetch-depth: 1

      - name: Replace remaining Lucide imports
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          replacements = {
              'Connect.tsx': [('ArrowLeft', '←')],
              'GoalReferenceList.tsx': [('Link2', '↗')],
              'Legal.tsx': [('ArrowLeft', '←')],
              'Onboarding.tsx': [('ArrowRight', '→'), ('ArrowLeft', '←'), ('Check', '✓')],
          }
          base = Path('src/components')
          for name, icons in replacements.items():
              path = base / name
              text = path.read_text()
              if 'lucide-react' not in text:
                  continue
              lines = text.splitlines()
              out = []
              replaced = False
              for line in lines:
                  if "from 'lucide-react'" in line or 'from "lucide-react"' in line:
                      for icon, symbol in icons:
                          out.append(f"const {icon} = ({'{ className = \'\' }'}: {{ className?: string }}) => <span aria-hidden=\"true\" className={{`inline-flex items-center justify-center leading-none ${{className}}`}}>{symbol}</span>;")
                      replaced = True
                  else:
                      out.append(line)
              if not replaced:
                  raise SystemExit(f'Lucide import not replaced in {name}')
              path.write_text('\n'.join(out) + '\n')
          PY

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-lucide.yml CLEANUP_LUCIDE_TRIGGER.txt
          git add src/components/Connect.tsx src/components/GoalReferenceList.tsx src/components/Legal.tsx src/components/Onboarding.tsx .github/workflows/cleanup-lucide.yml CLEANUP_LUCIDE_TRIGGER.txt
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "Remove final Lucide icon imports"
          git push origin HEAD:capacitor-mobile
