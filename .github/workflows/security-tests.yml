name: VOW Security Tests

on:
  push:
    branches:
      - fix/apk-blank-screen
      - capacitor-mobile
    paths:
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/migrations/**'
      - 'src/lib/urlSafety.ts'
      - 'src/components/GoalResources.tsx'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run media upload security regression tests
        run: deno test --no-check supabase/tests/media_security.test.ts
