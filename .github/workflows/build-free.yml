name: VOW Free Build

on:
  workflow_dispatch:
  push:
    branches: [capacitor-mobile]

jobs:
  build-free:
    runs-on: ubuntu-latest
    env:
      VITE_VOW_BUILD_TIER: free
    steps:
      - name: Checkout capacitor-mobile
        uses: actions/checkout@v4
        with:
          ref: capacitor-mobile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Free APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VOW Free APK

      - name: Upload Free APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW Free APK
          path: VOW-free-debug.apk
