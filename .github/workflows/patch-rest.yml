name: One-shot VOW patch

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'jxshua911'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capacitor-mobile
          fetch-depth: 0

      - name: Apply remaining VOW patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root = Path('.')

          goals = root / 'src/components/Goals.tsx'
          text = goals.read_text()
          old_import = "import { Plus, Check, Circle, CheckCircle2, SkipForward, Move, Pause, ChevronDown, ArrowLeft, Calendar, Clock } from 'lucide-react';"
          glyphs = """type GlyphProps = { className?: string };
          const makeGlyph = (symbol: string) => ({ className }: GlyphProps) => <span aria-hidden=\"true\" className={`inline-flex items-center justify-center leading-none ${className || ''}`}>{symbol}</span>;
          const Plus = makeGlyph('+');
          const Check = makeGlyph('✓');
          const Circle = makeGlyph('○');
          const CheckCircle2 = makeGlyph('✓');
          const SkipForward = makeGlyph('›');
          const Move = makeGlyph('↗');
          const Pause = makeGlyph('Ⅱ');
          const ChevronDown = makeGlyph('⌄');
          const ArrowLeft = makeGlyph('←');
          const Calendar = makeGlyph('□');
          const Clock = makeGlyph('◷');"""
          if old_import not in text:
              raise SystemExit('Goals.tsx Lucide import not found')
          goals.write_text(text.replace(old_import, glyphs, 1))

          planner = root / 'src/components/GoalPlanner.tsx'
          p = planner.read_text()
          if "import { checkContentSafety } from '@/lib/contentSafety';" not in p:
              p = p.replace("import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport { checkContentSafety } from '@/lib/contentSafety';", 1)
          if 'async function requireSafeText(text: string)' not in p:
              helper = """async function requireSafeText(text: string) {
            if (!text.trim()) return;
            const result = await checkContentSafety(text);
            if (result.status !== 'safe') throw new Error(result.message || 'Please reword the text and try again.');
          }

          """
              p = p.replace('export function GoalPlanner', helper + 'export function GoalPlanner', 1)
          old = "setBusy(true);setError('');try{const goalId=await ensureDraft();"
          if old not in p:
              raise SystemExit('GoalPlanner startPlanning anchor not found')
          p = p.replace(old, "setBusy(true);setError('');try{await requireSafeText([rawInput.trim(),why.trim()].filter(Boolean).join('\\n'));const goalId=await ensureDraft();", 1)
          old2 = "const clean=answers.map(a=>a.trim());"
          if old2 not in p:
              raise SystemExit('GoalPlanner buildPlan anchor not found')
          p = p.replace(old2, "const clean=answers.map(a=>a.trim());await requireSafeText(clean.filter(Boolean).join('\\n'));", 1)
          planner.write_text(p)

          journal = root / 'src/components/Journal.tsx'
          j = journal.read_text()
          if "import { checkContentSafety } from '@/lib/contentSafety';" not in j:
              j = j.replace("import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport { checkContentSafety } from '@/lib/contentSafety';", 1)
          old3 = "    setActionError('');\n    const { data, error } = await supabase.from('journal_entries').insert({"
          if old3 not in j:
              raise SystemExit('Journal create anchor not found')
          new3 = "    setActionError('');\n    const safety = await checkContentSafety([body.trim(), tag?.trim()].filter(Boolean).join('\\n'));\n    if (safety.status !== 'safe') throw new Error(safety.message || 'Please reword this entry and try again.');\n    const { data, error } = await supabase.from('journal_entries').insert({"
          j = j.replace(old3, new3, 1)
          journal.write_text(j)

          print('VOW patch files updated')
          PY

      - name: Commit patched files and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-rest.yml PATCH_TRIGGER.txt
          git add src/components/Goals.tsx src/components/GoalPlanner.tsx src/components/Journal.tsx .github/workflows/patch-rest.yml PATCH_TRIGGER.txt
          if git diff --cached --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git commit -m "Patch remaining VOW safety and icon issues"
          git push origin HEAD:capacitor-mobile
