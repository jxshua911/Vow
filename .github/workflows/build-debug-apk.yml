name: Build Android APK

# Release verification build: includes the current core + hardened branch state.
# Runtime repair verification build.

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Apply goal intelligence repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/vow-goal-ai/index.ts'); s=p.read_text()
          old='function contextualVideoQuery(a: any, g: any, session: any) { const text = `${g?.title || g?.outcome || ""} ${a?.category || ""} ${a?.goal_type || ""}`.toLowerCase(); const target = `${a?.target || ""} ${a?.target_unit || ""}`.toLowerCase(); const metric = str(a?.metric, 120); const equipment = Array.isArray(session?.equipment) ? session.equipment.slice(0, 2).join(" ") : ""; const difficulty = /50\\s*km|long|endurance|marathon|half[- ]marathon|advanced/.test(`${text} ${target}`) ? "long distance" : /10\\s*km|5\\s*km|beginner|first|learn/.test(`${text} ${target}`) ? "beginner" : "fundamentals"; if (/cycle|cycling|bike|bicycle/.test(text)) return `${difficulty} cycling endurance training ${metric} ${equipment} tips`.trim(); if (/run|running/.test(text)) return `${difficulty} running training ${metric} technique tips`.trim(); if (/swim|swimming/.test(text)) return `${difficulty} swimming technique ${metric} training tips`.trim(); if (/football|soccer/.test(text)) return `${difficulty} football training ${metric} drills`.trim(); return `${a?.category || "goal"} ${difficulty} fundamentals ${metric} practical tips`.trim(); }'
          new='''function parseTargetMinutes(timeTarget: unknown): number | null { const text=str(timeTarget,80).toLowerCase(); const m=text.match(/(\\d+(?:\\.\\d+)?)\\s*(hours?|hrs?|minutes?|mins?)/); if(!m) return /\\b(?:an?|one)\\s+hour\\b/.test(text)?60:null; const value=Number(m[1]); if(!Number.isFinite(value)||value<=0)return null; return /hour|hr/.test(m[2])?Math.round(value*60):Math.round(value); }
          function targetSessionDuration(a:any):number|null { const minutes=parseTargetMinutes(a?.time_target); return minutes&&minutes>=5&&minutes<=240?minutes:null; }
          function contextualVideoQuery(a:any,g:any,session:any){ const category=`${a?.category||''}`.toLowerCase(); const goalType=`${a?.goal_type||''}`.toLowerCase(); const target=`${a?.target||''}`.toLowerCase(); const metric=str(a?.metric,120).toLowerCase(); const time=str(a?.time_target,60).toLowerCase(); const domain=`${category} ${goalType}`; const difficulty=/50\\s*km|long|endurance|marathon|half[- ]marathon|advanced/.test(`${target} ${time}`)?'long distance':/10\\s*km|5\\s*km|beginner|first|learn/.test(`${target} ${time}`)?'beginner':'fundamentals'; const benchmark=time?` ${time} target`:''; if(/cycle|cycling|bike|bicycle/.test(domain))return `${difficulty} cycling pacing endurance technique${benchmark}`.replace(/\\s+/g,' ').trim(); if(/run|running/.test(domain))return `${difficulty} running pacing endurance technique${benchmark} ${metric}`.replace(/\\s+/g,' ').trim(); if(/swim|swimming/.test(domain))return `${difficulty} swimming technique pacing endurance${benchmark} ${metric}`.replace(/\\s+/g,' ').trim(); if(/football|soccer/.test(domain))return `${difficulty} football training drills decision making ${metric}`.replace(/\\s+/g,' ').trim(); return `${category||'goal'} ${goalType||'training'} ${difficulty} fundamentals practical technique${benchmark}`.replace(/\\s+/g,' ').trim(); }'''
          if old in s: s=s.replace(old,new)
          anchor='function enrichPlan(b: any, a: any, w: number, ds: string[], g: any, knowledge: any[], references: any[]) { const sessions = Array.isArray(b.session_templates) ? b.session_templates : []; return { ...b, session_templates: sessions.map((x: any) => enrichExecution(x, a, g, references)), assumptions:'
          repl='function enrichPlan(b: any, a: any, w: number, ds: string[], g: any, knowledge: any[], references: any[]) { const sessions = Array.isArray(b.session_templates) ? b.session_templates : []; const explicitDuration=targetSessionDuration(a); const normalised=sessions.map((x:any)=>({...x,duration_minutes:explicitDuration||Math.max(5,Math.min(240,Number(x?.duration_minutes)||30))})); return { ...b, session_templates: normalised.map((x: any) => enrichExecution(x, a, g, references)), assumptions:'
          if anchor in s: s=s.replace(anchor,repl)
          s=s.replace('duration_minutes: 45, preferred_time: "09:00", ...fallbackExecution(a, g, task)','duration_minutes: targetSessionDuration(a) || 45, preferred_time: "09:00", ...fallbackExecution(a, g, task)')
          old='const requested = p?.mode; mode = ["goal-clarify", "goal-plan", "chat"].includes(requested) ? requested : "chat"; const kind = mode === "goal-plan" ? "plan" : mode === "goal-clarify" ? "clarify" : "chat";'
          new='const requested=p?.mode; const normalisedMode=requested==="goal-plan"?"plan":requested==="goal-clarify"?"clarify":requested; mode=["plan","clarify","chat"].includes(normalisedMode)?normalisedMode:"chat"; const kind=mode as "plan"|"clarify"|"chat";'
          if old in s: s=s.replace(old,new)
          needle="For fitness/sports goals, reason about the target's scale: distinguish easy, moderate and demanding distances/workloads and adapt progression accordingly."
          if needle in s: s=s.replace(needle,needle+' If Armadillo supplies time_target, treat it as the explicit session-duration benchmark instead of defaulting to a shorter duration. If no time_target exists, choose duration from workload and recovery needs. Every generated session is executable and becomes a scheduled VOW session when the user locks in the plan.')
          p.write_text(s)

          p=Path('src/components/GoalPlanner.tsx'); s=p.read_text(); s=s.replace('The execution layer must turn that interpretation into specific guidance and choose the most appropriate demonstration strategy for each session.','The execution layer must turn that interpretation into specific guidance, choose the most appropriate demonstration strategy for each session, and execute the returned schedule into VOW sessions when the user locks it in. If Armadillo found an explicit time target, session duration must align with that target instead of defaulting to an arbitrary shorter duration.').replace("{saving?'Locking in...':'Lock in VOW'}","{saving?'Scheduling...':'Lock in & schedule VOW'}"); p.write_text(s)

          p=Path('src/components/AnteaterGuide.tsx'); s=p.read_text(); old='''function resourceLinks(activityType: string | undefined, goalText: string, armadillo?: GoalLike['armadillo']) {
  const value = `${activityType || ''} ${goalText} ${armadillo?.category || ''} ${armadillo?.goal_type || ''}`.toLowerCase();
  const links: Array<{ name: string; prompt: string; url: string }> = [];
  if (/run|running|cycle|cycling|bike|swim|football|training|fitness|workout|endurance|sport/.test(value)) {
    links.push({ name: 'Strava', prompt: 'Track the session and let VOW use the activity evidence later.', url: 'https://www.strava.com/' });
  }
  if (/health|fitness|run|running|cycle|cycling|bike|swim|walking|steps|workout|endurance/.test(value)) {
    links.push({ name: 'Samsung Health', prompt: 'Connect your health and activity data for broader progress evidence.', url: 'https://www.samsung.com/global/samsung-health/' });
  }
  return links;
}'''; new='''function resourceLinks(activityType: string | undefined, goalText: string, armadillo?: GoalLike['armadillo']) {
  const value = `${activityType || ''} ${goalText} ${armadillo?.category || ''} ${armadillo?.goal_type || ''}`.toLowerCase(); const links: Array<{name:string;prompt:string;url:string}>=[]; const keys=typeof window!=='undefined'?Object.keys(localStorage).filter(k=>k.startsWith('vow:connections:')):[]; const connected=keys.length?localStorage.getItem(keys[0])||'':''; const strava=connected.includes('strava'); const samsung=connected.includes('samsung-health')||connected.includes('samsung');
  if(/run|running|cycle|cycling|bike|swim|football|training|fitness|workout|endurance|sport/.test(value)) links.push({name:'Strava',prompt:strava?'Open Strava to review the activity evidence.':'Connect Strava so VOW can use activity evidence later.',url:'https://www.strava.com/'});
  if(/health|fitness|run|running|cycle|cycling|bike|swim|walking|steps|workout|endurance/.test(value)) links.push({name:'Samsung Health',prompt:samsung?'Open Samsung Health to review health and activity evidence.':'Connect Samsung Health so VOW can use broader progress evidence.',url:'https://www.samsung.com/global/samsung-health/'}); return links;
}''';
          if old in s:s=s.replace(old,new)
          s=s.replace('VOW is searching by the goal domain, difficulty, metric and practical context — not by copying the session sentence.','VOW is searching by Armadillo\'s goal domain, target, difficulty, metric and practical context — not by copying the goal name.'); p.write_text(s)

          p=Path('src/components/Profile.tsx'); s=p.read_text().replace('M28 24 L70 54 L28 84','M32 24 L76 54 L32 84').replace('w-16 h-16 rounded-xl','w-20 h-20 rounded-xl'); p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "VOW Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/vow-goal-ai/index.ts src/components/GoalPlanner.tsx src/components/AnteaterGuide.tsx src/components/Profile.tsx
          git commit -m "fix: align Armadillo timing and execute goal plans"
          git push origin capacitor-mobile
      - name: Enforce no Lucide icons
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -ni -e 'lucide-react' -e 'from \"lucide' -e "from 'lucide" -- src package.json || true)"
          if [[ -n "$matches" ]]; then printf '%s\n' "$matches"; echo "Lucide icon usage is forbidden in VOW."; exit 1; fi
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f
        with:
          scan-args: |-
            --format=table
            --lockfile=package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Assemble universal debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "VOW APK 1.2.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW APK 1.2-debug
          path: "VOW APK 1.2.apk"
          if-no-files-found: error
          retention-days: 14