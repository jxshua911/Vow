name: Build Android Debug APK

on:
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - run: npx cap sync android

      # Android 12+ always creates a system starting window. Make its splash icon
      # fully transparent so the native starting window cannot show the small
      # VOW mark before the app's own large splash screen.
      - name: Remove Android starting-window icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/vow_empty_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          EOF

          for f in android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-v33/styles.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@drawable/[^<]*splash[^<]*#@drawable/vow_empty_splash#g' "$f"
              sed -i 's#@drawable/[^<]*launcher[^<]*#@drawable/vow_empty_splash#g' "$f"
            fi
          done

          grep -RIl 'windowSplashScreenAnimatedIcon' android/app/src/main/res/values* 2>/dev/null | while read -r f; do
            sed -i 's#>[^<]*</item>#>@drawable/vow_empty_splash</item>#' "$f"
          done

      - run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Vow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
