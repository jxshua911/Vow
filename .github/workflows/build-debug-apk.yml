name: Build Android APK

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Assemble universal debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK compatibility
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          BADGING="$($BT/aapt dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.vow.app' versionCode='4' versionName='1.0.4'"
          echo "$BADGING" | grep -q "sdkVersion:'24'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86' 'x86_64'" || true

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Vow-1.0.4-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Vow Android 1.0.4 Debug APK
          path: "Vow-1.0.4-debug.apk"
          if-no-files-found: error
          retention-days: 14
