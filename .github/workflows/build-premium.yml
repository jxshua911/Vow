name: Build VOW Premium APK
# Personal QA variant: Premium features are enabled for the designated QA account.

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vow-android-premium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-premium:
    name: Build VOW Premium QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Premium web app
        env:
          VITE_VOW_BUILD_TIER: premium
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble Premium QA APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemblePremiumTestDebug --no-daemon --stacktrace

      - name: Verify Premium APK
        run: |
          test -s android/app/build/outputs/apk/premiumTest/debug/app-premiumTest-debug.apk
          grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml

      - name: Upload Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW Premium APK
          path: android/app/build/outputs/apk/premiumTest/debug/app-premiumTest-debug.apk
          if-no-files-found: error
          retention-days: 14
