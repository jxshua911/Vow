name: Build VOW Android APK

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vow-android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID }}
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Prepare release signing key
        env:
          VOW_RELEASE_KEYSTORE_B64: ${{ secrets.VOW_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$VOW_RELEASE_KEYSTORE_B64"
          echo "$VOW_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vow-release.keystore"
          test -s "$RUNNER_TEMP/vow-release.keystore"
      - name: Assemble VOW production release APK
        working-directory: android
        env:
          VOW_VERSION_CODE: "15"
          VOW_VERSION_NAME: "1.4"
          VOW_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/vow-release.keystore
          VOW_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.VOW_RELEASE_KEYSTORE_PASSWORD }}
          VOW_RELEASE_KEY_ALIAS: ${{ secrets.VOW_RELEASE_KEY_ALIAS }}
          VOW_RELEASE_KEY_PASSWORD: ${{ secrets.VOW_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleProductionRelease --no-daemon --stacktrace
      - name: Verify VOW production release APK
        run: |
          test -s android/app/build/outputs/apk/production/release/app-production-release.apk
          grep -q '<string name="app_name">VOW</string>' android/app/src/main/res/values/strings.xml
          grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
      - name: Upload VOW production release APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW APK 1.4 Production
          path: android/app/build/outputs/apk/production/release/app-production-release.apk
          if-no-files-found: error
          retention-days: 14
