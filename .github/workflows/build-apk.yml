name: Build VOW Android APK

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vow-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_MONTHLY_BASE_PLAN_ID }}
          VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID: ${{ secrets.VITE_GOOGLE_PLAY_PREMIUM_YEARLY_BASE_PLAN_ID }}
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Prepare production release keystore
        env:
          VOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.VOW_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$VOW_RELEASE_KEYSTORE_BASE64"
          echo "$VOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/vow-release.keystore
          chmod 600 android/vow-release.keystore
      - name: Assemble production and QA APKs
        working-directory: android
        env:
          VOW_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/vow-release.keystore
          VOW_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.VOW_RELEASE_KEYSTORE_PASSWORD }}
          VOW_RELEASE_KEY_ALIAS: ${{ secrets.VOW_RELEASE_KEY_ALIAS }}
          VOW_RELEASE_KEY_PASSWORD: ${{ secrets.VOW_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$VOW_RELEASE_KEYSTORE_PASSWORD"
          test -n "$VOW_RELEASE_KEY_ALIAS"
          test -n "$VOW_RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleProductionRelease assembleFreeTestDebug assemblePremiumTestDebug --no-daemon --stacktrace
      - name: Remove production release keystore
        if: always()
        run: rm -f android/vow-release.keystore
      - name: Verify APKs and labels
        run: |
          test -s android/app/build/outputs/apk/freeTest/debug/app-freeTest-debug.apk
          test -s android/app/build/outputs/apk/premiumTest/debug/app-premiumTest-debug.apk
          grep -q '<string name="app_name">VOW</string>' android/app/src/main/res/values/strings.xml
          grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
      - name: Upload QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: VOW QA APKs 1.4
          path: |
            android/app/build/outputs/apk/freeTest/debug/app-freeTest-debug.apk
            android/app/build/outputs/apk/premiumTest/debug/app-premiumTest-debug.apk
          if-no-files-found: error
          retention-days: 14
