name: VOW 1.0.8 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - capacitor-mobile

permissions:
  contents: read

concurrency:
  group: vow-1-0-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lint --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "VOW APK 1.0.8.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW APK 1.0.8
          path: "VOW APK 1.0.8.apk"
          if-no-files-found: error
          retention-days: 14
