name: VOW 1.3 Android APK

on:
  push:
    branches:
      - vow-1.3
      - capacitor-mobile
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vow-1-3-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run verify

      - name: Build APK from Capacitor Android project
        run: npm run android:build-apk

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Package release artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/VOW-1.3.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOW-1.3.0-debug-apk
          path: artifacts/VOW-1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
