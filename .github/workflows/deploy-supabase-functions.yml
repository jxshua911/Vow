name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - capacitor-mobile
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Optional function name to deploy explicitly'
        required: false
        type: string
      verify_secrets:
        description: 'Verify deployed functions and required AI secret names without showing values'
        required: false
        default: false
        type: boolean

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy changed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: vqsrdausvmfjayffxiuh
          DEPLOY_FUNCTION: ${{ inputs.function }}
          VERIFY_SECRETS: ${{ inputs.verify_secrets }}
        run: |
          set -euo pipefail

          if [ "$VERIFY_SECRETS" = "true" ]; then
            echo "Deployed Edge Functions:"
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

            echo "Checking required Edge Function secret names (values are never displayed):"
            secret_names="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -r '.[].name')"
            missing=0
            for secret in GROQ_API_KEY OPENAI_API_KEY; do
              if grep -Fxq "$secret" <<< "$secret_names"; then
                echo "$secret=SET"
              else
                echo "$secret=MISSING"
                missing=1
              fi
            done
            exit "$missing"
          elif [ -n "$DEPLOY_FUNCTION" ]; then
            if [[ ! "$DEPLOY_FUNCTION" =~ ^[a-z0-9-]+$ ]] || [ ! -d "supabase/functions/$DEPLOY_FUNCTION" ]; then
              echo "Invalid or unknown Edge Function: $DEPLOY_FUNCTION" >&2
              exit 1
            fi
            functions=("$DEPLOY_FUNCTION")
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="${GITHUB_SHA}^"
            fi

            changed_files="$(git diff --name-only "$base" "$GITHUB_SHA" -- 'supabase/functions/*')"
            mapfile -t functions < <(
              printf '%s\n' "$changed_files" |
                awk -F/ 'NF >= 3 {print $3}' |
                sort -u
            )
          fi

          if [ "${#functions[@]}" -eq 0 ]; then
            echo "No Edge Function source changes detected; nothing to deploy."
            exit 0
          fi

          for function in "${functions[@]}"; do
            echo "Deploying changed function: $function"
            if [ "$function" = "vow-blind-benchmark" ]; then
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done
