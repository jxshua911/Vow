name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - capacitor-mobile
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Google Calendar auth function
        run: supabase functions deploy google-calendar-auth --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Google Calendar events function
        run: supabase functions deploy google-calendar-events --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy VOW AI function
        run: supabase functions deploy vow-goal-ai --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy VOW content safety function
        run: supabase functions deploy vow-content-safety --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy goal calendar sync function
        run: supabase functions deploy google-calendar-sync-goal --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Goal resources function
        run: supabase functions deploy vow-goal-resources --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Strava OAuth function
        run: supabase functions deploy strava-oauth --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Strava activities function
        run: supabase functions deploy strava-activities --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Account deletion function
        run: supabase functions deploy vow-account-delete --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Google Play verification function
        run: supabase functions deploy vow-google-play-verify --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Google Play RTDN function
        run: supabase functions deploy vow-google-play-rtdn --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Account export function
        run: supabase functions deploy vow-account-export --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy weekly snapshot function
        run: supabase functions deploy vow-snapshot-weekly --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy knowledge embedding function
        run: supabase functions deploy vow-embed-knowledge --project-ref vqsrdausvmfjayffxiuh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
