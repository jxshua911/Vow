name: Prepare iOS Project

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: capacitor-mobile
          fetch-depth: 0
      - name: Check whether iOS project already exists
        id: ios-project
        run: |
          if test -f ios/App/App/Info.plist; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.ios-project.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.ios-project.outputs.exists != 'true'
        run: npm install --no-audit --no-fund
      - name: Build web app
        if: steps.ios-project.outputs.exists != 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Add iOS platform
        if: steps.ios-project.outputs.exists != 'true'
        run: npx cap add ios
      - name: Sync Capacitor iOS
        if: steps.ios-project.outputs.exists != 'true'
        run: npx cap sync ios
      - name: Configure calendar permissions
        if: steps.ios-project.outputs.exists != 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsUsageDescription string VOW needs calendar access to sync your goals and schedule." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsWriteOnlyAccessUsageDescription string VOW needs permission to add events to your calendar." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string VOW needs calendar access to sync your goals and schedule." ios/App/App/Info.plist
      - name: Commit generated iOS project
        if: steps.ios-project.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No iOS changes to commit."
            exit 0
          fi
          git commit -m "Prepare Capacitor iOS project"
          git push origin HEAD:capacitor-mobile
