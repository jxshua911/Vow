name: Repair Yellow Flags

on:
  workflow_dispatch:
  push:
    branches:
      - capacitor-mobile
    paths:
      - '.github/workflows/repair-yellow-flags.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capacitor-mobile
      - name: Apply transactional repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260910000000_add_transactional_goal_flows.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text(r'''create or replace function public.lock_goal_plan(
            p_goal_id uuid,
            p_goal jsonb,
            p_milestones jsonb,
            p_plan_items jsonb,
            p_sessions jsonb
          ) returns uuid
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            uid uuid := auth.uid();
            milestone_ids uuid[] := array[]::uuid[];
            item jsonb;
            session_item jsonb;
            inserted_id uuid;
            idx integer := 0;
            goal_exists boolean;
          begin
            if uid is null then raise exception 'AUTH_REQUIRED'; end if;
            select exists(select 1 from public.goals where id = p_goal_id and user_id = uid) into goal_exists;
            if not goal_exists then raise exception 'GOAL_NOT_FOUND'; end if;

            update public.goals
            set title = coalesce(p_goal->>'title', title),
                outcome = coalesce(p_goal->>'outcome', outcome),
                why_it_matters = nullif(p_goal->>'why_it_matters',''),
                start_date = nullif(p_goal->>'start_date','')::date,
                deadline = nullif(p_goal->>'deadline','')::date,
                duration = coalesce(p_goal->>'duration', duration),
                status = coalesce(p_goal->>'status', 'active'),
                weekly_commitment_target = coalesce((p_goal->>'weekly_commitment_target')::integer, weekly_commitment_target),
                armadillo = coalesce(p_goal->'armadillo', armadillo),
                armadillo_analyzed_at = coalesce(nullif(p_goal->>'armadillo_analyzed_at','')::timestamptz, armadillo_analyzed_at),
                plan_json = coalesce(p_goal->'plan_json', plan_json),
                plan_version = coalesce((p_goal->>'plan_version')::integer, plan_version),
                plan_generated_at = coalesce(nullif(p_goal->>'plan_generated_at','')::timestamptz, plan_generated_at),
                planning_horizon_weeks = coalesce((p_goal->>'planning_horizon_weeks')::integer, planning_horizon_weeks),
                planning_timezone = coalesce(p_goal->>'planning_timezone', planning_timezone),
                updated_at = now()
            where id = p_goal_id and user_id = uid;

            delete from public.goal_plan_items where goal_id = p_goal_id and user_id = uid;
            delete from public.sessions where goal_id = p_goal_id and user_id = uid;
            delete from public.milestones where goal_id = p_goal_id and user_id = uid;

            for item in select value from jsonb_array_elements(coalesce(p_milestones,'[]'::jsonb)) loop
              insert into public.milestones(goal_id,title,description,sort_order,deadline,status)
              values (p_goal_id,item->>'title',item->>'description',coalesce((item->>'sort_order')::integer,idx),nullif(item->>'deadline','')::date,coalesce(item->>'status','pending'))
              returning id into inserted_id;
              milestone_ids := array_append(milestone_ids, inserted_id);
              idx := idx + 1;
            end loop;

            for item in select value from jsonb_array_elements(coalesce(p_plan_items,'[]'::jsonb)) loop
              insert into public.goal_plan_items(goal_id,plan_version,week_number,day_of_week,scheduled_at,task,purpose,target_metric,duration_minutes,status)
              values (p_goal_id,coalesce((item->>'plan_version')::integer,1),(item->>'week_number')::integer,item->>'day_of_week',nullif(item->>'scheduled_at','')::timestamptz,item->>'task',nullif(item->>'purpose',''),nullif(item->>'target_metric',''),coalesce((item->>'duration_minutes')::integer,30),coalesce(item->>'status','scheduled'));
            end loop;

            for session_item in select value from jsonb_array_elements(coalesce(p_sessions,'[]'::jsonb)) loop
              idx := coalesce((session_item->>'milestone_sort_order')::integer,0) + 1;
              insert into public.sessions(goal_id,milestone_id,user_id,title,scheduled_at,duration_minutes,status,moved_count,notes,external_event_id)
              values (p_goal_id,case when idx between 1 and coalesce(array_length(milestone_ids,1),0) then milestone_ids[idx] else null end,uid,session_item->>'title',nullif(session_item->>'scheduled_at','')::timestamptz,coalesce((session_item->>'duration_minutes')::integer,30),coalesce(session_item->>'status','scheduled'),coalesce((session_item->>'moved_count')::integer,0),nullif(session_item->>'notes',''),nullif(session_item->>'external_event_id',''));
            end loop;

            return p_goal_id;
          end;
          $$;

          create or replace function public.complete_onboarding(
            p_settings jsonb,
            p_goal jsonb,
            p_milestones jsonb,
            p_sessions jsonb
          ) returns uuid
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            uid uuid := auth.uid();
            goal_id uuid;
            item jsonb;
            session_item jsonb;
            milestone_ids uuid[] := array[]::uuid[];
            inserted_id uuid;
            idx integer := 0;
          begin
            if uid is null then raise exception 'AUTH_REQUIRED'; end if;
            if coalesce(p_settings->>'user_id',uid::text) <> uid::text then raise exception 'USER_MISMATCH'; end if;
            insert into public.user_settings(user_id,timezone,preferred_session_times,notification_frequency,coaching_tone,onboarding_complete)
            values(uid,p_settings->>'timezone',p_settings->>'preferred_session_times',coalesce(p_settings->>'notification_frequency','weekly'),coalesce(p_settings->>'coaching_tone','honest_encouraging'),true)
            on conflict (user_id) do update set timezone=excluded.timezone,preferred_session_times=excluded.preferred_session_times,notification_frequency=excluded.notification_frequency,coaching_tone=excluded.coaching_tone,onboarding_complete=true,updated_at=now();

            insert into public.goals(user_id,title,outcome,why_it_matters,deadline,status,weekly_commitment_target,plan_json)
            values(uid,p_goal->>'title',p_goal->>'outcome',nullif(p_goal->>'why_it_matters',''),nullif(p_goal->>'deadline','')::date,'active',(p_goal->>'weekly_commitment_target')::integer,p_goal->'plan_json')
            returning id into goal_id;

            for item in select value from jsonb_array_elements(coalesce(p_milestones,'[]'::jsonb)) loop
              insert into public.milestones(goal_id,title,description,sort_order,deadline,status)
              values(goal_id,item->>'title',item->>'description',coalesce((item->>'sort_order')::integer,idx),nullif(item->>'deadline','')::date,coalesce(item->>'status','pending'))
              returning id into inserted_id;
              milestone_ids := array_append(milestone_ids,inserted_id);
              idx := idx + 1;
            end loop;

            for session_item in select value from jsonb_array_elements(coalesce(p_sessions,'[]'::jsonb)) loop
              idx := coalesce((session_item->>'milestone_sort_order')::integer,0) + 1;
              insert into public.sessions(goal_id,milestone_id,user_id,title,scheduled_at,duration_minutes,status)
              values(goal_id,case when idx between 1 and coalesce(array_length(milestone_ids,1),0) then milestone_ids[idx] else null end,uid,session_item->>'title',nullif(session_item->>'scheduled_at','')::timestamptz,coalesce((session_item->>'duration_minutes')::integer,30),'scheduled');
            end loop;
            return goal_id;
          end;
          $$;

          revoke all on function public.lock_goal_plan(uuid,jsonb,jsonb,jsonb,jsonb) from public, anon;
          grant execute on function public.lock_goal_plan(uuid,jsonb,jsonb,jsonb,jsonb) to authenticated;
          revoke all on function public.complete_onboarding(jsonb,jsonb,jsonb,jsonb) from public, anon;
          grant execute on function public.complete_onboarding(jsonb,jsonb,jsonb,jsonb) to authenticated;
          ''' + '\n')

          # Replace GoalPlanner's multi-write commit with one transactional RPC while keeping client-side scheduling intact.
          p = Path('src/components/GoalPlanner.tsx')
          s = p.read_text()
          start = s.index('  async function handleCreate(){')
          end = s.index('\n  if(plan){', start)
          replacement = r'''  async function handleCreate(){if(!plan||!draftGoalId||saving)return;setSaving(true);setError('');try{const start=nextMonday();const version=1;const {data:existingSessions,error:existingError}=await supabase.from('sessions').select('scheduled_at,duration_minutes').eq('user_id',userId).eq('status','scheduled').neq('goal_id',draftGoalId);if(existingError)throw existingError;const occupied=toOccupiedSlots((existingSessions||[]).map(row=>({scheduledAt:row.scheduled_at,durationMinutes:row.duration_minutes})));const schedule=plan.schedule.filter(item=>availableDays.includes(item.day)).map(item=>{const week=Math.max(1,Math.min(durationWeeks,Number(item.week)||1));const dayIndex=Math.max(0,DAYS.indexOf(item.day));const requested=addDays(start,(week-1)*7+dayIndex);const preferredTime=dayTimes[item.day]||plan.preferred_times_by_day?.[item.day];const match=/^(\d{1,2}):(\d{2})$/.exec(preferredTime||'');if(!match)throw new Error(`Choose a time for ${item.day} before locking in your goal.`);requested.setHours(Math.min(23,Number(match[1])),Math.min(59,Number(match[2])),0,0);const durationMinutes=Math.max(5,Number(item.duration_minutes)||30);const slot=allocateSameDaySlot(requested,durationMinutes,occupied);if(!slot)throw new Error(`No available time remains on ${item.day} for week ${week}. Choose another day or reduce the number of sessions.`);reserveSlot(slot,occupied);return{item,week,date:slot.date,durationMinutes};});if(!schedule.length)throw new Error('The generated schedule does not match your selected days.');const milestoneRows=plan.milestones.map((m,i)=>({title:m.title,description:m.description,sort_order:i,deadline:deadlineFor(start,Math.min(durationWeeks,Math.max(1,m.week))),status:i===0?'in_progress':'pending'}));const planRows=schedule.map(({item,week,date,durationMinutes})=>({plan_version:version,week_number:week,day_of_week:item.day,scheduled_at:date.toISOString(),task:item.task,purpose:item.purpose||null,target_metric:item.target_metric||plan.success_metric,duration_minutes:durationMinutes,status:'scheduled'}));const sessionRows=schedule.map(({item,week,date,durationMinutes})=>({milestone_sort_order:Math.min(plan.milestones.length-1,Math.floor(((Math.max(1,week)-1)/Math.max(1,durationWeeks))*plan.milestones.length)),title:item.task,scheduled_at:date.toISOString(),duration_minutes:durationMinutes,status:'scheduled',moved_count:0,notes:[item.purpose,item.target_metric?`Target: ${item.target_metric}`:null].filter(Boolean).join('\n')||null,external_event_id:null}));const goalPayload={title:rawInput.trim(),outcome:plan.outcome||rawInput.trim(),why_it_matters:why.trim()||null,start_date:toDateString(start),deadline:deadlineFor(start,durationWeeks),duration:`${durationWeeks}w`,status:'active',weekly_commitment_target:availableDays.length,armadillo:plan.armadillo||armadillo,armadillo_analyzed_at:new Date().toISOString(),plan_json:plan,plan_version:version,plan_generated_at:new Date().toISOString(),planning_horizon_weeks:durationWeeks,planning_timezone:Intl.DateTimeFormat().resolvedOptions().timeZone};const {data,error:rpcError}=await supabase.rpc('lock_goal_plan',{p_goal_id:draftGoalId,p_goal:goalPayload,p_milestones:milestoneRows,p_plan_items:planRows,p_sessions:sessionRows});if(rpcError||!data)throw rpcError||new Error('VOW could not lock the goal plan. Nothing was committed.');const {data:sessions,error:sessionReadError}=await supabase.from('sessions').select('*').eq('goal_id',draftGoalId).eq('user_id',userId).eq('status','scheduled').order('scheduled_at',{ascending:true});if(sessionReadError)throw sessionReadError;try{if(sessions)await syncUpcomingSessionNotifications(sessions as Session[]);}catch{console.warn('[VOW] Session notifications could not be synced.');}const {data:calendar,error:ce}=await supabase.functions.invoke('google-calendar-sync-goal',{body:{goalId:draftGoalId}});if(ce)console.warn('[VOW] Google Calendar sync unavailable or not connected.',ce);else if(calendar?.created_count)console.info(`[VOW] ${calendar.created_count} Google Calendar events created.`);onCreated();}catch(err){setError(err instanceof Error?err.message:'Failed to create goal.');}finally{setSaving(false);}}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Replace onboarding's multi-write completion with one transactional RPC.
          p = Path('src/components/Onboarding.tsx')
          s = p.read_text()
          start = s.index('  async function handleComplete(){')
          end = s.index('\n  const steps =', start)
          replacement = r'''  async function handleComplete(){if(!decomposed)return;if(selectedDays.length===0){setError('Choose at least one day that works for you.');return;}const missing=missingTimes();if(missing.length){setError(`Choose a comfortable time for ${missing.join(', ')} before locking in your first goal.`);return;}setSaving(true);setError(null);try{const safety=await checkContentSafety([decomposed.outcome||rawGoal.trim(),whyItMatters.trim()].filter(Boolean).join('\n'));if(safety.status!=='safe')throw new Error(safety.message||'Please reword your goal and try again.');const settings={user_id:userId,timezone,preferred_session_times:JSON.stringify(dayTimes),notification_frequency:notificationFreq,coaching_tone:'honest_encouraging'};const milestoneRows=decomposed.milestones.map((m,i)=>({title:m.title,description:m.description,sort_order:i,deadline:toDateString(addDays(new Date(),m.weeksOut*7)),status:i===0?'in_progress':'pending'}));const firstMilestone=decomposed.milestones[0]?.title||decomposed.outcome;const sessions=selectedDays.map((day)=>{const start=new Date();const currentDay=start.getDay()===0?7:start.getDay();const targetDay=DAYS.indexOf(day)+1;const offset=(targetDay-currentDay+7)%7||7;const sessionDate=addDays(start,offset);const [hour,minute]=dayTimes[day].split(':').map(Number);sessionDate.setHours(hour,minute,0,0);return{milestone_sort_order:0,title:firstMilestone,scheduled_at:sessionDate.toISOString(),duration_minutes:decomposed.suggestedSessionDuration,status:'scheduled'};});const goal={title:decomposed.outcome,outcome:decomposed.outcome,why_it_matters:whyItMatters.trim()||null,deadline:decomposed.deadline,weekly_commitment_target:selectedDays.length,plan_json:{available_days:selectedDays,preferred_times_by_day:dayTimes,onboarding_generated:true}};const {data,error:rpcError}=await supabase.rpc('complete_onboarding',{p_settings:settings,p_goal:goal,p_milestones:milestoneRows,p_sessions:sessions});if(rpcError||!data)throw rpcError||new Error('VOW could not complete onboarding. Nothing was committed.');onComplete();}catch(err){setError(err instanceof Error?err.message:'Failed to save. Please try again.');}finally{setSaving(false);}}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "VOW Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260910000000_add_transactional_goal_flows.sql src/components/GoalPlanner.tsx src/components/Onboarding.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "fix: make goal flows transactional"
          git push origin capacitor-mobile
