name: Repair Goal Intelligence, Execution and Icon UX

on:
  push:
    branches:
      - capacitor-mobile
    paths:
      - '.github/workflows/repair-goal-intelligence-execution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capacitor-mobile
      - name: Apply focused repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Armadillo timing + context-aware resource query.
          p = Path('supabase/functions/vow-goal-ai/index.ts')
          s = p.read_text()
          if 'function targetSessionDuration' not in s:
              marker = 'function contextualVideoQuery(a: any, g: any, session: any) {'
              i = s.index(marker)
              j = s.index('\nfunction fallbackExecution', i)
              replacement = r'''function parseTargetMinutes(timeTarget: unknown): number | null {
            const text = str(timeTarget, 80).toLowerCase();
            const m = text.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)/);
            if (!m) return /\b(?:an?|one)\s+hour\b/.test(text) ? 60 : null;
            const value = Number(m[1]);
            if (!Number.isFinite(value) || value <= 0) return null;
            return /hour|hr/.test(m[2]) ? Math.round(value * 60) : Math.round(value);
          }
          function targetSessionDuration(a: any): number | null {
            const minutes = parseTargetMinutes(a?.time_target);
            return minutes && minutes >= 5 && minutes <= 240 ? minutes : null;
          }
          function contextualVideoQuery(a: any, g: any, session: any) {
            const category = `${a?.category || ''}`.toLowerCase();
            const goalType = `${a?.goal_type || ''}`.toLowerCase();
            const target = `${a?.target || ''}`.toLowerCase();
            const metric = str(a?.metric, 120).toLowerCase();
            const time = str(a?.time_target, 60).toLowerCase();
            const domain = `${category} ${goalType}`;
            const difficulty = /50\s*km|long|endurance|marathon|half[- ]marathon|advanced/.test(`${target} ${time}`) ? 'long distance' : /10\s*km|5\s*km|beginner|first|learn/.test(`${target} ${time}`) ? 'beginner' : 'fundamentals';
            const benchmark = time ? ` ${time} target` : '';
            if (/cycle|cycling|bike|bicycle/.test(domain)) return `${difficulty} cycling pacing endurance technique${benchmark}`.replace(/\s+/g, ' ').trim();
            if (/run|running/.test(domain)) return `${difficulty} running pacing endurance technique${benchmark} ${metric}`.replace(/\s+/g, ' ').trim();
            if (/swim|swimming/.test(domain)) return `${difficulty} swimming technique pacing endurance${benchmark} ${metric}`.replace(/\s+/g, ' ').trim();
            if (/football|soccer/.test(domain)) return `${difficulty} football training drills decision making ${metric}`.replace(/\s+/g, ' ').trim();
            return `${category || 'goal'} ${goalType || 'training'} ${difficulty} fundamentals practical technique${benchmark}`.replace(/\s+/g, ' ').trim();
          }'''
              s = s[:i] + replacement + s[j:]
          s = s.replace('duration_minutes: 45, preferred_time: "09:00", ...fallbackExecution(a, g, task)', 'duration_minutes: targetSessionDuration(a) || 45, preferred_time: "09:00", ...fallbackExecution(a, g, task)')
          if 'const explicitDuration = targetSessionDuration(a);' not in s:
              old = 'function enrichPlan(b: any, a: any, w: number, ds: string[], g: any, knowledge: any[], references: any[]) { const sessions = Array.isArray(b.session_templates) ? b.session_templates : []; return { ...b, session_templates: sessions.map((x: any) => enrichExecution(x, a, g, references)), assumptions:'
              new = 'function enrichPlan(b: any, a: any, w: number, ds: string[], g: any, knowledge: any[], references: any[]) { const sessions = Array.isArray(b.session_templates) ? b.session_templates : []; const explicitDuration = targetSessionDuration(a); const normalised = sessions.map((x: any) => ({ ...x, duration_minutes: explicitDuration || Math.max(5, Math.min(240, Number(x?.duration_minutes) || 30)) })); return { ...b, session_templates: normalised.map((x: any) => enrichExecution(x, a, g, references)), assumptions:'
              if old not in s: raise SystemExit('enrichPlan anchor missing')
              s = s.replace(old, new)
          needle = "For fitness/sports goals, reason about the target's scale: distinguish easy, moderate and demanding distances/workloads and adapt progression accordingly."
          if needle in s and 'time_target, treat it as' not in s:
              s = s.replace(needle, needle + ' If Armadillo supplies time_target, treat it as the explicit session-duration benchmark instead of defaulting to a shorter duration. If no time_target exists, choose duration from workload and recovery needs. Every generated session is executable and becomes a scheduled VOW session when the user locks in the plan.')
          p.write_text(s)

          # Planner makes the generated schedule executable.
          p = Path('src/components/GoalPlanner.tsx'); s = p.read_text()
          s = s.replace('The execution layer must turn that interpretation into specific guidance and choose the most appropriate demonstration strategy for each session.', 'The execution layer must turn that interpretation into specific guidance, choose the most appropriate demonstration strategy for each session, and execute the returned schedule into VOW sessions when the user locks it in. If Armadillo found an explicit time target, session duration must align with that target instead of defaulting to an arbitrary shorter duration.')
          s = s.replace("{saving?'Locking in...':'Lock in VOW'}", "{saving?'Scheduling...':'Lock in & schedule VOW'}")
          p.write_text(s)

          # Goal Intelligence resources: use Armadillo's interpreted domain/target, and distinguish connected integrations.
          p = Path('src/components/AnteaterGuide.tsx'); s = p.read_text()
          s = re.sub(r'function resourceLinks\([\s\S]*?\n\}', '''function resourceLinks(activityType: string | undefined, goalText: string, armadillo?: GoalLike['armadillo']) {
            const value = `${activityType || ''} ${goalText} ${armadillo?.category || ''} ${armadillo?.goal_type || ''}`.toLowerCase();
            const links: Array<{ name: string; prompt: string; url: string }> = [];
            const keys = typeof window !== 'undefined' ? Object.keys(localStorage).filter((key) => key.startsWith('vow:connections:')) : [];
            const connected = keys.length ? localStorage.getItem(keys[0]) || '' : '';
            const stravaConnected = connected.includes('strava');
            const samsungConnected = connected.includes('samsung-health') || connected.includes('samsung');
            if (/run|running|cycle|cycling|bike|swim|football|training|fitness|workout|endurance|sport/.test(value)) {
              links.push({ name: 'Strava', prompt: stravaConnected ? 'Open Strava to review the activity evidence.' : 'Connect Strava so VOW can use activity evidence later.', url: 'https://www.strava.com/' });
            }
            if (/health|fitness|run|running|cycle|cycling|bike|swim|walking|steps|workout|endurance/.test(value)) {
              links.push({ name: 'Samsung Health', prompt: samsungConnected ? 'Open Samsung Health to review health and activity evidence.' : 'Connect Samsung Health so VOW can use broader progress evidence.', url: 'https://www.samsung.com/global/samsung-health/' });
            }
            return links;
          }''', s, count=1)
          s = s.replace('VOW is searching by the goal domain, difficulty, metric and practical context — not by copying the session sentence.', "VOW is searching by Armadillo's goal domain, target, difficulty, metric and practical context — not by copying the goal name.")
          p.write_text(s)

          # Profile logo: clean, centred greater-than mark.
          p = Path('src/components/Profile.tsx'); s = p.read_text()
          s = s.replace('M28 24 L70 54 L28 84', 'M32 24 L76 54 L32 84')
          s = s.replace('w-16 h-16 rounded-xl', 'w-20 h-20 rounded-xl')
          p.write_text(s)
          PY
      - name: Commit repairs once
        shell: bash
        run: |
          git config user.name "VOW Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/vow-goal-ai/index.ts src/components/GoalPlanner.tsx src/components/AnteaterGuide.tsx src/components/Profile.tsx
          if git diff --cached --quiet; then echo "No source changes needed"; exit 0; fi
          git commit -m "fix: align Armadillo timing and execute goal plans"
          git push origin capacitor-mobile
