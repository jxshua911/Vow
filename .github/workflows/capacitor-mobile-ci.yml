name: Capacitor Mobile CI

on:
  push:
    branches:
      - capacitor-mobile
  pull_request:
    branches:
      - capacitor-mobile

permissions:
  contents: read

concurrency:
  group: capacitor-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report npm audit findings
        run: |
          npm audit --json > /tmp/vow-npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/vow-npm-audit.json', 'utf8'));
          const vulnerabilities = Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).map((via) => typeof via === 'string' ? via : via.title),
          }));
          console.log(JSON.stringify({ totals: audit.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          NODE
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Functions
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-goal-ai/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-create-checkout/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-google-play-verify/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-stripe-webhook/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-account-delete/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-account-deletion-confirmation-email/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-premium-confirmation-email/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/vow-support/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/google-calendar-auth/index.ts
      - name: Unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build production app
        run: npm run build
