name: Build iOS VOW

on:
  push:
    branches:
      - capacitor-mobile
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iOS simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS simulator app
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r "Vow iOS Simulator.app.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: Vow iOS Simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/Vow iOS Simulator.app.zip
          if-no-files-found: error
